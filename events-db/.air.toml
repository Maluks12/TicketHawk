# .air.toml - Windows config

tmp_dir = "tmp"

# Watch directories for changes
watch_dir = [
  ".",
  "cmd",
  "internal",
  "migrations",
  "scripts"
]

# Exclude tmp folder
exclude_dir = ["tmp"]

[build]
# Windows build command
cmd = "go build -o tmp/main.exe ./cmd/api"
bin = "tmp/main.exe"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor"]
delay = 100

[log]
time = true

[color]
main = "yellow"
watch = "cyan"
build = "green"
runner = "magenta"
