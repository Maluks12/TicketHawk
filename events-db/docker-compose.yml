services:

  # ── Dev Database ────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: events_dev
    ports:
      - "5434:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
      - ./seed.sql:/seed.sql   # makes seed.sql available inside the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d events_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go API ──────────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Test Database (keep for go test runs) ───────────────────────────────────
  test-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data:
  test-db-data: